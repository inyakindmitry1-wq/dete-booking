<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Онлайн-запись</title>
    <!-- Dynamic tenant meta tags will be updated at runtime -->
    <link rel="icon" id="favicon-link" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" id="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%BASE_URL%pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%BASE_URL%pwa-512x512.png" />
    <link rel="manifest" id="manifest-link" href="%BASE_URL%manifest.webmanifest" />
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
